<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel PTAC · PGM Fortaleza</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:wght@600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --verde: #0a8a7a; --verde-escuro: #076b5e; --laranja: #e05020;
  --cinza-bg: #f4f5f6; --cinza-borda: #dde1e5;
  --texto: #1a1f24; --texto-sec: #5a6472; --branco: #ffffff;
  --radius: 8px; --radius-lg: 12px;
}
body { font-family: 'Source Sans 3', sans-serif; background: var(--cinza-bg); color: var(--texto); min-height: 100vh; }

.header { background: var(--branco); border-bottom: 3px solid var(--verde); }
.header-top { display: flex; align-items: center; padding: 1rem 2rem; gap: 1.5rem; max-width: 960px; margin: 0 auto; }
.header-logo img { height: 48px; display: block; }
.header-divider { width: 1px; height: 40px; background: var(--cinza-borda); }
.header-info h1 { font-family: 'Source Serif 4', serif; font-size: 20px; font-weight: 600; color: var(--verde-escuro); line-height: 1.2; }
.header-info p { font-size: 12.5px; color: var(--texto-sec); margin-top: 2px; }

.abas { background: var(--branco); border-bottom: 1px solid var(--cinza-borda); }
.abas-in { max-width: 960px; margin: 0 auto; padding: 0 2rem; display: flex; gap: 4px; }
.aba { background: none; border: none; border-bottom: 3px solid transparent; padding: 14px 18px 11px; font-family: inherit; font-size: 14.5px; font-weight: 600; color: var(--texto-sec); cursor: pointer; margin-bottom: -1px; }
.aba:hover { color: var(--texto); }
.aba.ativa { color: var(--verde-escuro); border-bottom-color: var(--verde); }

.container { max-width: 960px; margin: 0 auto; padding: 1.5rem 2rem 3rem; }
.card { background: var(--branco); border: 1px solid var(--cinza-borda); border-radius: var(--radius-lg); padding: 1.25rem 1.5rem; margin-bottom: 1rem; }

.scorecards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.scorecards.um { grid-template-columns: 1fr; margin-bottom: 1rem; }
.scorecard { background: var(--branco); border-radius: var(--radius-lg); border: 1px solid var(--cinza-borda); padding: .85rem .75rem; text-align: center; }
.scorecard-label { font-size: 10.5px; font-weight: 600; color: var(--texto-sec); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
.scorecard-valor { font-size: 20px; font-weight: 600; line-height: 1.1; }
.scorecard-valor.azul { color: #185FA5; }
.scorecard-valor.verde { color: var(--verde); }
.scorecard-valor.laranja { color: var(--laranja); }
.scorecard-sub { font-size: 12px; color: var(--texto-sec); margin-top: 6px; }
.painel-card { background: var(--branco); border-radius: var(--radius-lg); border: 1px solid var(--cinza-borda); padding: 1.25rem 1.5rem; margin-bottom: 1rem; }
.painel-titulo { font-size: 14px; font-weight: 600; color: var(--texto); margin-bottom: .75rem; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 1rem; }
.chip { background: var(--branco); border: 1.5px solid var(--cinza-borda); border-radius: 20px; padding: 6px 14px; font-family: inherit; font-size: 13px; font-weight: 600; color: var(--texto); cursor: pointer; }
.chip:hover { border-color: var(--verde); }
.chip.ativo { background: var(--verde); border-color: var(--verde); color: #fff; }
.chip .n { font-weight: 500; opacity: .75; margin-left: 4px; }

.busca { width: 100%; padding: 12px 14px; border: 1.5px solid var(--cinza-borda); border-radius: var(--radius); font-size: 14px; font-family: inherit; background: var(--branco); }
.busca:focus { outline: none; border-color: var(--verde); }
.dica { font-size: 12px; color: var(--texto-sec); margin: .6rem 0 .25rem; }

.mes-topo { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 1.25rem 0 .5rem; }
.mes-titulo { font-size: 15px; font-weight: 700; }
.mes-resumo { font-size: 12.5px; color: var(--texto-sec); }
.grupo { padding: .5rem .75rem; margin-bottom: 0; }

.linha { display: flex; align-items: center; gap: 12px; padding: 12px 10px; border-bottom: 1px solid var(--cinza-borda); border-radius: 6px; border-left: 3px solid transparent; }
.linha:last-child { border-bottom: none; }
.linha.concluido { background: #f1f9f6; border-left-color: var(--verde); }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--verde); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex-shrink: 0; }
.linha-corpo { flex: 1; min-width: 0; }
.linha-nome { font-size: 13.5px; font-weight: 600; overflow-wrap: anywhere; }
.linha-nome span { font-weight: 400; color: var(--texto-sec); font-size: 12px; }
.linha-valores { font-size: 13px; font-weight: 600; color: var(--verde-escuro); margin-top: 3px; }
.linha-lado { display: flex; flex-direction: column; align-items: center; gap: 5px; flex-shrink: 0; min-width: 120px; }
.selo-fase { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; white-space: nowrap; }

.menu-wrap { position: relative; display: inline-block; }
.btn-parecer { position: relative; background: none; border: none; cursor: pointer; padding: 4px 6px; border-radius: 6px; color: var(--texto-sec); display: flex; align-items: center; justify-content: center; }
.btn-parecer:hover, .btn-parecer:focus-visible { background: rgba(0,0,0,.07); color: var(--verde-escuro); outline: none; }
.btn-parecer:disabled { opacity: .5; cursor: wait; }
.btn-parecer .qtd { position: absolute; top: -3px; right: -4px; background: var(--verde); color: #fff; border-radius: 9px; font-size: 10px; font-weight: 700; min-width: 16px; height: 16px; line-height: 16px; text-align: center; padding: 0 4px; }
.menu-pareceres { position: absolute; right: 0; top: calc(100% + 4px); z-index: 20; width: 300px; max-width: 80vw; background: var(--branco); border: 1px solid var(--cinza-borda); border-radius: var(--radius); box-shadow: 0 6px 20px rgba(0,0,0,.15); padding: 4px; text-align: left; }
.menu-item { display: block; width: 100%; text-align: left; background: none; border: none; border-radius: 6px; padding: 8px 10px; font-family: inherit; cursor: pointer; color: var(--texto); }
.menu-item:hover, .menu-item:focus-visible { background: rgba(10,138,122,.08); outline: none; }
.menu-item b { display: block; font-size: 13px; overflow-wrap: anywhere; }
.menu-item small { display: block; font-size: 11.5px; color: var(--texto-sec); margin-top: 2px; }

.estado { text-align: center; color: var(--texto-sec); font-size: 14px; padding: 2.5rem 1rem; }
.btn-secundario { margin-top: 12px; background: var(--branco); border: 1.5px solid var(--cinza-borda); border-radius: var(--radius); padding: 8px 14px; font-family: inherit; font-size: 13.5px; cursor: pointer; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #1a1f24; color: #fff; padding: 10px 16px; border-radius: var(--radius); font-size: 13.5px; z-index: 50; max-width: 90vw; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.toast[hidden] { display: none; }
.rodape { text-align: center; font-size: 11px; font-style: italic; color: #78808a; padding: 0 1rem 2rem; }

@media (max-width: 640px) {
  .header-top { padding: .8rem 1rem; flex-direction: column; align-items: flex-start; gap: .5rem; }
  .header-divider { display: none; }
  .header-info h1 { font-size: 18px; }
  .abas-in { padding: 0 .5rem; }
  .aba { flex: 1; padding: 13px 8px 10px; font-size: 14px; }
  .container { padding: 1rem; }
  .scorecards { grid-template-columns: 1fr; gap: 10px; }
  .linha { flex-wrap: wrap; }
  .linha-lado { flex-direction: row; align-items: center; width: 100%; justify-content: space-between; padding-left: 46px; min-width: 0; }
}
</style>
</head>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwExDsErJUwGo9W1VDgAHmYjId3HrX22eFSA6lFlz6RoUVXRLv6uJLJMVt7zKvkxNPtLw/exec";

const MESES = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
const MESES_ABREV = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];

const FASES = {
  "Instaurado": { r: "Instaurado", bg: "#fdecea", t: "#c0392b" },
  "Oficio expedido a SEFIN": { r: "Ofício expedido à SEFIN", bg: "#fdeee2", t: "#b8541f" },
  "Elaboracao de parecer": { r: "Elaboração de parecer", bg: "#fdf3d8", t: "#9a7207" },
  "Aprovacao pela chefia": { r: "Aprovação pela chefia", bg: "#eef7e0", t: "#5a8f2e" },
  "Concluido": { r: "Concluído", bg: "#e1f5ee", t: "#076b5e" },
  "Concluido/Extinto": { r: "Concluído", bg: "#e1f5ee", t: "#076b5e" }
};

const ICONE_DOWNLOAD = `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`;

let devedores = [];
let resumo = null;
let carregado = false;
let mesSel = "todos";   // "todos" | "aaaa-mm" | "sem-data"
let busca = "";

function esc(t) {
  return String(t === undefined || t === null ? "" : t)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function normaliza(t) { return String(t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase(); }
function fmt(v) { return "R$ " + Number(v || 0).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function plural(n, um, varios) { return n + " " + (n === 1 ? um : varios); }
function iniciais(nome) {
  const p = String(nome || "").trim().split(/\s+/).filter(Boolean);
  return ((p[0] || "?")[0] + ((p[1] || "")[0] || "")).toUpperCase();
}
function tamanho(b) {
  b = Number(b) || 0;
  return b >= 1048576 ? (b / 1048576).toFixed(1).replace(".", ",") + " MB" : Math.max(1, Math.round(b / 1024)) + " KB";
}
function dataBR(d) { const dt = new Date(d); return isNaN(dt) ? "" : dt.toLocaleDateString("pt-BR"); }
function citacao(valor) {
  const m = String(valor || "").match(/^\s*(I{1,3}|IV|V|VI)\b/);
  return m ? "Art. 5º, §1º, " + m[1] + " Portaria 53/2026-GPG" : null;
}
function selo(status) {
  const f = FASES[status];
  if (!f) return `<span class="selo-fase" style="background:#eceff1;color:#5a6472">${esc(status || "—")}</span>`;
  return `<span class="selo-fase" style="background:${f.bg};color:${f.t}">${f.r}</span>`;
}
const concluidoStatus = s => s === "Concluido" || s === "Concluido/Extinto";

// "aaaa-mm" do mes de instauracao (a data ja chega como aaaa-mm-dd, sem depender do fuso do navegador)
function chaveMes(d) {
  const m = String(d.dataInstauracao || "").match(/^(\d{4})-(0[1-9]|1[0-2])/);
  return m ? m[1] + "-" + m[2] : "sem-data";
}
function tituloMes(chave) {
  if (chave === "sem-data") return "Sem data de instauração";
  const [a, m] = chave.split("-");
  return MESES[Number(m) - 1] + " de " + a;
}
function rotuloChip(chave) {
  if (chave === "sem-data") return "Sem data";
  const [a, m] = chave.split("-");
  return MESES_ABREV[Number(m) - 1] + "/" + a;
}

async function api(acao, params, tentativa) {
  tentativa = tentativa || 1;
  const partes = ["acao=" + encodeURIComponent(acao)];
  Object.keys(params || {}).forEach(k => partes.push(k + "=" + encodeURIComponent(params[k])));
  partes.push("_=" + Date.now());
  try {
    const resp = await fetch(APPS_SCRIPT_URL + "?" + partes.join("&"), { cache: "no-store" });
    return JSON.parse(await resp.text());
  } catch (erro) {
    if (tentativa < 3) {
      await new Promise(r => setTimeout(r, 700 * tentativa));
      return api(acao, params, tentativa + 1);
    }
    throw erro;
  }
}

async function carregar() {
  document.getElementById("app").innerHTML = `<div class="estado">Carregando…</div>`;
  try {
    const r = await api("painelPtac");
    if (!r || r.erro || !Array.isArray(r.devedores)) throw new Error(r && r.erro ? r.erro : "resposta inesperada");
    devedores = r.devedores.map(d => Object.assign({}, d, { pareceres: Array.isArray(d.pareceres) ? d.pareceres : [] }));
    resumo = r.resumo || null;
    carregado = true;
    render();
  } catch (e) {
    document.getElementById("app").innerHTML = `<div class="card estado">Não foi possível carregar os dados agora.<br><button class="btn-secundario" onclick="carregar()">Tentar de novo</button></div>`;
  }
}

function abaAtual() { return location.hash === "#andamento" ? "andamento" : "painel"; }

function render() {
  fecharMenu();
  const aba = abaAtual();
  document.querySelectorAll(".aba").forEach(b => {
    const ativa = b.dataset.aba === aba;
    b.classList.toggle("ativa", ativa);
    if (ativa) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
  if (!carregado) return;
  if (aba === "andamento") renderAndamento(); else renderPainelGeral();
  window.scrollTo(0, 0);
}

/* ---------------- Painel geral ---------------- */
function renderPainelGeral() {
  document.getElementById("app").innerHTML = resumo
    ? painelGeralHtml(resumo)
    : `<div class="card estado">Os números do painel não estão disponíveis no momento.</div>`;
}

function painelGeralHtml(r) {
  const n = v => Number(v || 0).toLocaleString("pt-BR");
  const instaurados = (r.casosEmCurso || 0) + (r.casosConcluidos || 0);
  const card = (rotulo, valor, cor) => `<div class="scorecard"><div class="scorecard-label">${rotulo}</div><div class="scorecard-valor ${cor}">${valor}</div></div>`;
  const painel = (titulo, a, b, c) => `<div class="painel-card"><div class="painel-titulo">${titulo}</div><div class="scorecards">${a}${b}${c}</div></div>`;
  return `
    <div class="scorecards um"><div class="scorecard"><div class="scorecard-label">Total</div><div class="scorecard-valor azul">${n(r.totalCasos)}</div><div class="scorecard-sub">casos cadastrados</div></div></div>
    ${painel("Instaurado — fluxo PTAC",
      card("Processos instaurados", n(instaurados), "azul"),
      card("Valor total instaurado", fmt((r.saldoEmCurso || 0) + (r.saldoConcluido || 0)), "azul"),
      card("Execuções fiscais", n((r.efEmCurso || 0) + (r.efConcluido || 0)), "azul"))}
    ${painel("Em curso — fluxo PTAC",
      card("Processos em curso", n(r.casosEmCurso), "laranja"),
      card("Valor em curso", fmt(r.saldoEmCurso), "laranja"),
      card("Execuções fiscais em curso", n(r.efEmCurso), "laranja"))}
    ${painel("Concluído — fluxo PTAC",
      card("Processos concluídos", n(r.casosConcluidos), "verde"),
      card("Tratamento adequado (valor)", fmt(r.saldoConcluido), "verde"),
      card("Execuções fiscais extintas", n(r.efConcluido), "verde"))}`;
}

/* ---------------- Andamento (lista por mes, somente leitura) ---------------- */
function agruparPorMes(lista) {
  const grupos = {};
  lista.forEach(d => { (grupos[chaveMes(d)] = grupos[chaveMes(d)] || []).push(d); });
  return grupos;
}
function ordemMeses(grupos) {
  const chaves = Object.keys(grupos).filter(k => k !== "sem-data").sort();
  if (grupos["sem-data"]) chaves.push("sem-data");
  return chaves;
}

function renderAndamento() {
  const app = document.getElementById("app");
  if (!devedores.length) { app.innerHTML = `<div class="card estado">Nenhum PTAC cadastrado ainda.</div>`; return; }
  const grupos = agruparPorMes(devedores);
  const chaves = ordemMeses(grupos);
  if (mesSel !== "todos" && !grupos[mesSel]) mesSel = "todos";

  const chip = (chave, rotulo, n) => `<button class="chip${mesSel === chave ? " ativo" : ""}" data-mes="${esc(chave)}" aria-pressed="${mesSel === chave}">${esc(rotulo)}<span class="n">${n}</span></button>`;
  app.innerHTML = `
    <div class="chips" id="chips">${chip("todos", "Todos", devedores.length)}${chaves.map(k => chip(k, rotuloChip(k), grupos[k].length)).join("")}</div>
    <input class="busca" id="busca" type="search" placeholder="Buscar devedor por nome ou CPF/CNPJ" value="${esc(busca)}" autocomplete="off">
    <div class="dica">O ícone <b>⬇</b> aparece nos devedores com parecer anexado: clique para baixar.</div>
    <div id="lista-meses"></div>`;

  document.getElementById("chips").addEventListener("click", ev => {
    const b = ev.target.closest(".chip");
    if (!b) return;
    mesSel = b.dataset.mes;
    renderAndamento();
  });
  const campo = document.getElementById("busca");
  campo.addEventListener("input", () => { busca = campo.value; renderListaMeses(); });
  document.getElementById("lista-meses").addEventListener("click", cliqueLista);
  renderListaMeses();
}

function renderListaMeses() {
  fecharMenu();
  const termo = normaliza(busca);
  const termoDigitos = busca.replace(/\D/g, "");
  const filtrados = devedores.filter(d => !termo
    || normaliza(d.devedor).includes(termo)
    || (termoDigitos && String(d.documento || "").replace(/\D/g, "").includes(termoDigitos)));
  const grupos = agruparPorMes(filtrados);
  const chaves = ordemMeses(grupos).filter(k => mesSel === "todos" || k === mesSel);

  const alvo = document.getElementById("lista-meses");
  if (!chaves.length) { alvo.innerHTML = `<div class="card estado" style="margin-top:1rem">Nenhum devedor encontrado.</div>`; return; }
  alvo.innerHTML = chaves.map(k => {
    const lista = [...grupos[k]].sort((a, b) => (Number(b.saldo) || 0) - (Number(a.saldo) || 0));
    const saldo = lista.reduce((s, d) => s + (Number(d.saldo) || 0), 0);
    const exec = lista.reduce((s, d) => s + (Number(d.execucoes) || 0), 0);
    return `<div class="mes-topo">
        <h2 class="mes-titulo">${esc(tituloMes(k))}</h2>
        <span class="mes-resumo">${plural(lista.length, "PTAC", "PTACs")} · ${fmt(saldo)} · ${plural(exec, "execução", "execuções")}</span>
      </div>
      <div class="card grupo">${lista.map(linhaHtml).join("")}</div>`;
  }).join("");
}

function linhaHtml(d) {
  const h = citacao(d.hipotese);
  const n = d.pareceres.length;
  let botao = "";
  if (n) {
    const p = d.pareceres[0];
    const dica = n === 1
      ? "Baixar parecer: " + (p.titulo || p.nomeArquivo) + (p.autor ? " — " + p.autor : "") + (dataBR(p.data) ? ", " + dataBR(p.data) : "")
      : "Baixar parecer (" + n + " pareceres)";
    botao = `<span class="menu-wrap"><button class="btn-parecer" data-caso="${esc(d.casoId)}" title="${esc(dica)}" aria-label="Baixar parecer de ${esc(d.devedor)}">${ICONE_DOWNLOAD}${n > 1 ? `<span class="qtd">${n}</span>` : ""}</button></span>`;
  }
  return `<div class="linha${concluidoStatus(d.status) ? " concluido" : ""}">
    <div class="avatar">${esc(iniciais(d.devedor))}</div>
    <div class="linha-corpo">
      <div class="linha-nome">${esc(d.devedor)} <span>${d.documento ? "- " + esc(d.documento) : ""} · ${h ? esc(h) : "Hipótese não informada"}</span></div>
      <div class="linha-valores">${fmt(d.saldo)} · ${plural(Number(d.execucoes) || 0, "execução", "execuções")} · ${plural(Number(d.cdas) || 0, "CDA", "CDAs")}</div>
    </div>
    <div class="linha-lado">${selo(d.status)}${botao}</div>
  </div>`;
}

/* ---------------- Download de parecer ---------------- */
function fecharMenu() { document.querySelectorAll(".menu-pareceres").forEach(m => m.remove()); }

function cliqueLista(ev) {
  const item = ev.target.closest(".menu-item");
  if (item) {
    const principal = item.closest(".menu-wrap").querySelector(".btn-parecer");
    fecharMenu();
    baixar(item.dataset.baixar, principal);
    return;
  }
  const botao = ev.target.closest(".btn-parecer");
  if (!botao) return;
  const d = devedores.find(x => String(x.casoId) === botao.dataset.caso);
  if (!d || !d.pareceres.length) return;
  if (d.pareceres.length === 1) { baixar(d.pareceres[0].id, botao); return; }
  const jaAberto = botao.parentElement.querySelector(".menu-pareceres");
  fecharMenu();
  if (jaAberto) return;
  const itens = [...d.pareceres].sort((a, b) => Number(b.id) - Number(a.id));
  const menu = document.createElement("div");
  menu.className = "menu-pareceres";
  menu.innerHTML = itens.map(p => `<button class="menu-item" data-baixar="${esc(p.id)}"><b>${esc(p.titulo || p.nomeArquivo)}</b><small>${esc(p.autor)}${dataBR(p.data) ? " · " + dataBR(p.data) : ""} · ${tamanho(p.tamanho)}</small></button>`).join("");
  botao.parentElement.appendChild(menu);
}
document.addEventListener("click", ev => { if (!ev.target.closest(".menu-wrap")) fecharMenu(); });
document.addEventListener("keydown", ev => { if (ev.key === "Escape") fecharMenu(); });

function avisar(texto) {
  const t = document.getElementById("toast");
  t.textContent = texto; t.hidden = false;
  clearTimeout(avisar.tempo);
  avisar.tempo = setTimeout(() => { t.hidden = true; }, 5000);
}

async function baixar(id, botao) {
  botao.disabled = true;
  try {
    const r = await api("baixarParecer", { id: id });
    if (!r || r.erro) throw new Error(r && r.erro ? r.erro : "falha ao obter o arquivo");
    const bin = atob(r.base64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([bytes], { type: r.mime || "application/pdf" }));
    const a = document.createElement("a");
    a.href = url; a.download = r.nome || "parecer.pdf";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  } catch (e) {
    avisar("Não foi possível baixar este parecer agora. Tente novamente em instantes.");
  } finally {
    botao.disabled = false;
  }
}

document.querySelectorAll(".aba").forEach(b => b.addEventListener("click", () => {
  const alvo = b.dataset.aba === "andamento" ? "#andamento" : "";
  if (location.hash === alvo) render(); // ja estava nessa aba: so redesenha
  else location.hash = alvo;            // o evento hashchange redesenha
}));
window.addEventListener("hashchange", render);
render();
carregar();
</script>
